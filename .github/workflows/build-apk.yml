name: Build APK (Android)

on:
  workflow_dispatch:
  push:
    branches: [claude/pc-mobile-control-app-ocafmo]
    paths: ['app/**', '.github/workflows/build-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Gerar projeto Android
        run: flutter create . --platforms=android --project-name pc_remote --org dev.pcremote

      - name: Permissões (internet, microfone, HTTP na LAN)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms='''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application android:usesCleartextTraffic="true"'''
          s=s.replace('<application',perms,1)
          open(p,'w').write(s)
          PY

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: pc-remote-apk
          path: app/build/app/outputs/flutter-apk/*-release.apk
